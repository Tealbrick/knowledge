name: Publish Knowledge 0.1.0 image

on:
  push:
    tags: ['v0.1.0']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: knowledge-image-0.1.0
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tealbrick/knowledge
  VERSION: 0.1.0

jobs:
  publish:
    outputs:
      image_reference: ${{ steps.digest.outputs.reference }}
      package_visibility: ${{ steps.visibility.outputs.visibility || 'private' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate source and generated deployment artifacts
        run: |
          node deploy/container/generate-public-deployment.mjs --check
          test "$(node -p "require('./manifest.json').version")" = "$VERSION"
      - name: Authenticate only the publisher job to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file deploy/container/Dockerfile \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .
      - name: Request public package visibility when organization policy allows
        id: visibility
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/knowledge" \
            -f visibility=public; then
            echo 'visibility=public' >> "$GITHUB_OUTPUT"
          else
            echo 'visibility=private' >> "$GITHUB_OUTPUT"
            echo 'Package was published, but organization policy did not permit making it public.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record immutable digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).digest)')"
          case "$digest" in sha256:[a-f0-9][a-f0-9]*) ;; *) echo "No immutable digest returned" >&2; exit 1 ;; esac
          echo "reference=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          printf 'Published image: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  agent-acceptance:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KNOWLEDGE_IMAGE: ${{ needs.publish.outputs.image_reference }}
      KNOWLEDGE_PACKAGE_VISIBILITY: ${{ needs.publish.outputs.package_visibility }}
      KNOWLEDGE_REGISTRY_ACCESS: ${{ needs.publish.outputs.package_visibility == 'public' && 'anonymous' || 'authenticated' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Authenticate only when package remains private
        if: env.KNOWLEDGE_PACKAGE_VISIBILITY != 'public'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull image and run agent-first acceptance
        run: |
          docker pull "$KNOWLEDGE_IMAGE"
          node deploy/container/image-agent-acceptance.mjs
