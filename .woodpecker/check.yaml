# Woodpecker CI (self-hosted). GitHub stores code only; GitHub Actions is not used.
# Checks only: no secrets, no privileged or Docker-in-Docker steps.
#
# Sibling pipelines in this folder:
#   - image.yaml: unprivileged image build check (no push)
#   - conformance.yaml: contract conformance run against the edge from source
#   - publish-dev-image.yaml: dev image push (push to main and manual only)
# Not run in any pipeline: the source-build acceptance run (image build plus
# agent-first API acceptance) and the os-backports image build. Those stay
# release-time jobs on the CI host or on Railway.
labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

variables:
  - &node_image node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
  - &env
    CI: "true"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

steps:
  - name: install
    image: *node_image
    environment: *env
    commands:
      - cd program
      - corepack enable && corepack prepare pnpm@9.15.4 --activate
      - pnpm install --frozen-lockfile

  - name: typecheck
    image: *node_image
    environment: *env
    commands:
      - cd program
      - corepack enable && corepack prepare pnpm@9.15.4 --activate
      - pnpm run typecheck

  - name: build
    image: *node_image
    environment: *env
    commands:
      - cd program
      - corepack enable && corepack prepare pnpm@9.15.4 --activate
      - pnpm run build

  - name: test-program
    image: *node_image
    environment: *env
    commands:
      - cd program
      - corepack enable && corepack prepare pnpm@9.15.4 --activate
      - pnpm run test:program --maxWorkers=2

  - name: test-web
    image: *node_image
    environment: *env
    commands:
      - cd program
      - corepack enable && corepack prepare pnpm@9.15.4 --activate
      - pnpm run test:web --maxWorkers=2

  - name: deploy-container-tests
    image: *node_image
    environment: *env
    commands:
      # .test.ts files run through Node 24 type stripping (new tests are TypeScript; older ones stay .mjs).
      - node --test deploy/container/*.test.mjs deploy/container/*.test.ts
      # Public-deployment and Portal recipe generator output must match the checked-in files.
      - node deploy/container/generate-public-deployment.mjs --check

  - name: validate-manifest
    image: *node_image
    environment: *env
    commands:
      # Runs once the app manifest exists on main; skipped until then. The manifest declares partitions contract 2
      # (read sets), which needs the 0.1.0-alpha.5 validator, the same kit the Program pins (program/package.json).
      - |
        if [ -f tealbrick.app.json ]; then
          npx --yes @tealbrick/contract@0.1.0-alpha.5 validate tealbrick.app.json
        else
          echo "tealbrick.app.json not present; skipping manifest validation"
        fi
