# Contract conformance: boots the Knowledge instance edge from source next to the
# fake Portal of the published conformance runner and runs the section 8 checks
# against it. Everything runs inside one unprivileged step on loopback ports. The
# keys and tokens are generated per run and thrown away; there are no secrets and
# no external services. The memory engine is the repository's disposable fake
# Hindsight service (program/scripts/fixtures/fake-engines.mjs), so the run
# checks the contract surface, not answer quality.
#
# The published fake Portal (conformance 0.1.0-alpha.2) still does not state a memory
# partition in its app-grant answers. Knowledge declares `runtime.partitions` and refuses
# a grant that does not state one (fail closed), so the app process preloads a stand-in
# that adds the explicit company scope (`partitionKey: null`) to those answers, as Portal
# Core does for an unpartitioned edge. Nothing else is changed in what the app receives.
# Remove the stand-in when the fake Portal sends `partitionKey` itself.
#
# Fails when the runner reports `ok: false` or the report is missing.
labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

variables:
  - &node_image node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20

steps:
  - name: conformance
    image: *node_image
    environment:
      CI: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    commands:
      - |
        set -eu
        W="$CI_WORKSPACE"
        RUN=/tmp/conformance
        mkdir -p "$RUN/data" "$RUN/runner"
        corepack enable && corepack prepare pnpm@9.15.4 --activate
        (cd program && pnpm install --frozen-lockfile)
        npm install --prefix "$RUN/runner" --no-audit --no-fund @tealbrick/conformance@0.1.0-alpha.2
        CLI="$RUN/runner/node_modules/@tealbrick/conformance/dist/cli.js"
        wait_for() { # url, seconds
          node -e 'const [u,s]=process.argv.slice(1);const end=Date.now()+s*1000;(async()=>{for(;;){try{if((await fetch(u)).ok)return}catch{}if(Date.now()>end){console.error("timeout waiting for "+u);process.exit(1)}await new Promise(r=>setTimeout(r,500))}})()' "$1" "$2"
        }
        PORTAL_PID=""; APP_PID=""; ENGINE_PID=""
        cleanup() { for pid in "$APP_PID" "$PORTAL_PID" "$ENGINE_PID"; do [ -z "$pid" ] || kill "$pid" 2>/dev/null || true; done; }
        trap cleanup EXIT
        # Fake Portal (loopback). Its output env carries the app-facing values.
        node "$CLI" portal --manifest "$W/tealbrick.app.json" --port 18410 --env-out "$RUN/portal.env" > "$RUN/portal.log" 2>&1 &
        PORTAL_PID=$!
        i=0; while [ ! -s "$RUN/portal.env" ]; do i=$((i+1)); [ "$i" -lt 60 ] || { cat "$RUN/portal.log"; echo "fake Portal did not start"; exit 1; }; sleep 0.5; done
        set -a; . "$RUN/portal.env"; set +a
        # The runner control values stay out of the app environment.
        CONTROL_TOKEN="$TEALBRICK_CONFORMANCE_CONTROL_TOKEN"
        CONTROL_URL="$TEALBRICK_CONFORMANCE_PORTAL_URL"
        unset TEALBRICK_CONFORMANCE_PORTAL_URL TEALBRICK_CONFORMANCE_CONTROL_TOKEN
        # Disposable fake memory engine on a random loopback port; its key is generated per run.
        ENGINE_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(24).toString("hex"))')"
        cat > "$RUN/fake-engine.mjs" <<'JS'
        import { writeFileSync } from "node:fs";
        const { startFakeHindsight } = await import(process.argv[2] + "/program/scripts/fixtures/fake-engines.mjs");
        const engine = await startFakeHindsight({ apiKey: process.argv[3] });
        writeFileSync(process.argv[4], engine.baseUrl);
        setInterval(() => {}, 1 << 30);
        JS
        node "$RUN/fake-engine.mjs" "$W" "$ENGINE_KEY" "$RUN/engine.url" > "$RUN/engine.log" 2>&1 &
        ENGINE_PID=$!
        i=0; while [ ! -s "$RUN/engine.url" ]; do i=$((i+1)); [ "$i" -lt 60 ] || { cat "$RUN/engine.log"; echo "fake memory engine did not start"; exit 1; }; sleep 0.5; done
        cat > "$RUN/partition-standin.mjs" <<'JS'
        const real = globalThis.fetch;
        globalThis.fetch = async (input, init) => {
          const response = await real(input, init);
          const url = new URL(typeof input === "string" || input instanceof URL ? input : input.url);
          if (!response.ok || url.pathname !== "/api/runtime/app-grant/introspect") return response;
          const body = await response.json();
          if (body && typeof body === "object" && !Array.isArray(body) && !("partitionKey" in body)) body.partitionKey = null;
          return new Response(JSON.stringify(body), { status: response.status, headers: { "content-type": "application/json" } });
        };
        JS
        (cd program && NODE_ENV=production HOST=127.0.0.1 PORT=18411 KNOWLEDGE_DATA_DIR="$RUN/data" KNOWLEDGE_GBRAIN_AUTOSTART=false \
          KNOWLEDGE_MEMORY_ENGINE=hindsight KNOWLEDGE_HINDSIGHT_URL="$(cat "$RUN/engine.url")" KNOWLEDGE_HINDSIGHT_API_KEY="$ENGINE_KEY" \
          exec node --import tsx --import "$RUN/partition-standin.mjs" ../deploy/container/server.ts) > "$RUN/app.log" 2>&1 &
        APP_PID=$!
        wait_for http://127.0.0.1:18411/healthz 90 || { cat "$RUN/app.log"; exit 1; }
        set +e
        TEALBRICK_CONFORMANCE_CONTROL_TOKEN="$CONTROL_TOKEN" TEALBRICK_CONFORMANCE_PORTAL_URL="$CONTROL_URL" node "$CLI" run \
          --app http://127.0.0.1:18411 --manifest "$W/tealbrick.app.json" \
          --json --out "$RUN/report.json" --slow > "$RUN/run.out" 2>&1
        rc=$?
        set -e
        node -e '
          const fs = require("node:fs");
          let r;
          try { r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
          catch { console.log(fs.readFileSync(process.argv[2], "utf8")); console.log("conformance report is missing or unreadable"); process.exit(1); }
          const failing = r.checks.filter((c) => c.status === "FAIL");
          console.log("conformance summary", JSON.stringify(r.summary), "ok=" + r.ok);
          for (const c of failing) console.log("FAIL", c.id, (c.evidence || []).filter((e) => String(e).startsWith("FAIL")).slice(0, 3).join(" | "));
          process.exit(r.ok === true && failing.length === 0 ? 0 : 1);
        ' "$RUN/report.json" "$RUN/run.out"
