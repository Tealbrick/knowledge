# Container image build check (no push). Proves deploy/container/Dockerfile still
# builds, using an unprivileged builder: no privileged step, no host socket, no
# added capabilities, no secrets. Same Dockerfile as the knowledge-image workflow.
# The prebuilt operating-system backports stage is pulled by digest, so the
# build skips the stages the runtime image does not use. Publishing stays a
# release-time job (see publish-dev-image.yaml and the image workflows).
labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: image-build
    image: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    commands:
      - >-
        /kaniko/executor
        --no-push
        --skip-unused-stages
        --context "$CI_WORKSPACE"
        --dockerfile "$CI_WORKSPACE/deploy/container/Dockerfile"
        --tar-path /tmp/image.tar
        --verbosity info
      - |
        set -eu
        mkdir /tmp/img
        tar -xf /tmp/image.tar -C /tmp/img
        found=0
        for f in $(find /tmp/img -type f); do
          if tar -tf "$f" 2>/dev/null | grep -q 'tealbrick\.app\.json$'; then
            found=1
            echo "tealbrick.app.json found in $(basename "$f")"
          fi
        done
        [ "$found" = 1 ] || { echo "tealbrick.app.json is not in the image"; exit 1; }
