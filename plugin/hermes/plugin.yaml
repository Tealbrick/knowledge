name: knowledge
version: 0.2.0
description: "Agent adapter manifest for Knowledge. Documents and Research remain canonical Product surfaces while Brain is exposed as a first-grade GBrain-powered cognition surface."
author: Tealbrick
kind: full-on
depends_on:
  - rules-approvals
  - work-ethic-kanban
  - local-runtime-bridge
program:
  base_url_env: KNOWLEDGE_BASE_URL
  health: /healthz
remote_runtime:
  contract: remote-plugin/knowledge/remote-runtime.json
  connection_file: remote-plugin/knowledge/runtime-connection.json
  mode: remote
provides_tools:
  - knowledge_health
  - knowledge_status
  - knowledge_docs_collections_list
  - knowledge_docs_collections_create
  - knowledge_docs_search
  - knowledge_docs_tree
  - knowledge_docs_create
  - knowledge_docs_read
  - knowledge_docs_update
  - knowledge_docs_revisions_list
  - knowledge_docs_access_get
  - knowledge_docs_access_update
  - knowledge_ingest_run
  - knowledge_research_notebooks_list
  - knowledge_research_notebooks_discover
  - knowledge_research_engine_get
  - knowledge_research_sources_list
  - knowledge_research_source_get
  - knowledge_research_notes_list
  - knowledge_research_note_get
  - knowledge_research_context_get
  - knowledge_research_source_create
  - knowledge_research_write_receipt_get
  - knowledge_research_chat_create
  - knowledge_research_chat_get
  - knowledge_research_chat_send
  - knowledge_research_chat_receipt_get
  - knowledge_bindings_create
  - knowledge_bindings_list
  - knowledge_bindings_remove
  - brain_context_for_task
  - brain_context_for_thread
  - brain_recall
  - brain_query
  - brain_think
  - knowledge_brain_tools
  - knowledge_brain_call
  - brain_entity_profile
  - brain_graph_traverse
requires_env:
  - KNOWLEDGE_BASE_URL
tool_contract:
  knowledge_research_notebooks_discover:
    method: GET
    path: /api/research/engine/notebooks
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_engine_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_sources_list:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/sources
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_source_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/sources/:sourceId
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_notes_list:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/notes
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_note_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/notes/:noteId
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_context_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/context
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_source_create:
    method: POST
    path: /api/research/notebooks/:notebookId/engine/sources
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:write"]
    idempotency_key_required: true
  knowledge_research_write_receipt_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/write-receipts/:idempotencyKey
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:write"]
  knowledge_research_chat_create:
    method: POST
    path: /api/research/notebooks/:notebookId/engine/chat/sessions
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:write"]
    idempotency_key_required: true
  knowledge_research_chat_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/chat/sessions/:sessionId
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read"]
  knowledge_research_chat_send:
    method: POST
    path: /api/research/notebooks/:notebookId/engine/chat/sessions/:sessionId/messages
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read", "research:write"]
    idempotency_key_required: true
  knowledge_research_chat_receipt_get:
    method: GET
    path: /api/research/notebooks/:notebookId/engine/chat/receipts/:idempotencyKey
    auth_required: true
    auth_env: KNOWLEDGE_RESEARCH_SERVICE_TOKEN
    policy_owner: knowledge-program
    rules_gate: false
    capabilities: ["research:read", "research:write"]
  knowledge_health:
    method: GET
    path: /healthz
    auth_required: false
  knowledge_status:
    method: GET
    path: /api/status
    auth_required: false
  knowledge_docs_collections_list:
    method: GET
    path: /api/knowledge/collections
    rules_gate: true
    posture: governed_read
  knowledge_docs_collections_create:
    method: POST
    path: /api/companies/:companyId/knowledge/collections
    rules_gate: true
    posture: governed_write
  knowledge_docs_search:
    method: GET
    path: /api/companies/:companyId/knowledge/search
    rules_gate: true
    posture: governed_read
  knowledge_docs_tree:
    method: GET
    path: /api/knowledge/collections/:collectionId/tree
    rules_gate: true
    posture: governed_read
  knowledge_docs_create:
    method: POST
    path: /api/knowledge/collections/:collectionId/documents
    rules_gate: true
    posture: governed_write
  knowledge_docs_read:
    method: GET
    path: /api/knowledge/documents/:documentId
    rules_gate: true
    posture: governed_read
  knowledge_docs_update:
    method: PATCH
    path: /api/knowledge/documents/:documentId
    rules_gate: true
    posture: governed_write
  knowledge_docs_revisions_list:
    method: GET
    path: /api/knowledge/documents/:documentId/revisions
    rules_gate: true
    posture: governed_read
  knowledge_docs_access_get:
    method: GET
    path: /api/knowledge/documents/:documentId/access
    rules_gate: true
    posture: governed_read
  knowledge_docs_access_update:
    method: PUT
    path: /api/knowledge/documents/:documentId/access
    rules_gate: true
    posture: governed_write
  knowledge_ingest_run:
    method: POST
    path: /api/companies/:companyId/knowledge/ingest-runs
    rules_gate: true
    posture: governed_write
  knowledge_research_notebooks_list:
    method: GET
    path: /api/companies/:companyId/research/notebooks
    rules_gate: true
    posture: governed_read
  knowledge_bindings_create:
    method: POST
    path: /api/bindings
    rules_gate: true
    posture: governed_cross_plugin_mutation
  knowledge_bindings_list:
    method: GET
    path: /api/bindings
    rules_gate: true
    posture: governed_read
  knowledge_bindings_remove:
    method: DELETE
    path: /api/bindings/:bindingId
    rules_gate: true
    posture: governed_cross_plugin_mutation
  brain_context_for_task:
    method: POST
    path: /api/brain/context
    rules_gate: true
    posture: governed_brain_context
  brain_context_for_thread:
    method: POST
    path: /api/brain/context
    rules_gate: true
    posture: governed_brain_context
  brain_recall:
    method: POST
    path: /api/brain/recall
    rules_gate: true
    posture: governed_brain_read
  brain_query:
    method: POST
    path: /api/brain/context
    rules_gate: true
    posture: governed_brain_read
  brain_think:
    method: POST
    path: /api/brain/native/think
    auth_env: KNOWLEDGE_SERVICE_TOKEN
    rules_gate: true
    posture: governed_brain_context
  knowledge_brain_tools:
    method: GET
    path: /api/brain/native/tools
    auth_env: KNOWLEDGE_SERVICE_TOKEN
    rules_gate: true
    posture: governed_brain_read
  knowledge_brain_call:
    method: POST
    path: /api/brain/native/:operation
    auth_env: KNOWLEDGE_SERVICE_TOKEN
    rules_gate: true
    posture: governed_native_memory
  brain_entity_profile:
    method: GET
    path: /api/brain/entities
    rules_gate: true
    posture: governed_brain_read
  brain_graph_traverse:
    method: GET
    path: /api/brain/entities
    rules_gate: true
    posture: governed_brain_read
brain_contract:
  runtime: gbrain
  first_grade_surface: true
  adapter_mode: program_authenticated_native_remote_plus_legacy_private_projection
  native_catalog: /api/brain/native/tools
  native_dispatch: /api/brain/native/:operation
  projected_sources:
    - knowledge-docs
    - knowledge-research
    - knowledge-social
    - knowledge-entities
  composed_tools:
    brain_entity_profile:
      uses:
        - get_page
        - recall
        - traverse_graph
        - get_links
        - get_backlinks
failure_policy: fail-closed-for-mutations
